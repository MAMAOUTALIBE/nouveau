[project]
name = "rh-primature-backend"
version = "0.1.0"
description = "Backend Python/FastAPI de l'application RH de la Primature de Guinée"
requires-python = ">=3.12,<3.14"
license = { text = "Proprietary" }
authors = [{ name = "Primature de Guinée" }]

dependencies = [
    "fastapi>=0.115.0,<0.120",
    "uvicorn[standard]>=0.32.0",
    "gunicorn>=23.0.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pydantic>=2.9.0,<3",
    "pydantic-settings>=2.6.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.2.0,<5",
    "pyjwt[crypto]>=2.10.0",
    "python-multipart>=0.0.20",
    "structlog>=24.4.0",
    "httpx>=0.28.0",
    "email-validator>=2.2.0",
    "pyotp>=2.9.0",
    "cryptography>=43.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "types-passlib>=1.7.7",
    "freezegun>=1.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# ----------------------------------------------------------------------
# Ruff — lint + format unifié
# ----------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF",
    "S",  # bandit (sécurité)
    "T20", # print
    "PT", # pytest
    "ASYNC",
]
ignore = [
    "S101",   # assert dans tests
    "B008",   # FastAPI Depends() en argument par défaut
    "RUF012", # mutable class defaults — on contrôle via Final[]
    "UP031",  # %-format toléré pour messages de validation
    # Caractères Unicode "ambigus" mais volontaires (UI/docs en français) :
    # fil d'Ariane « › » (Module › Sous-module), tiret cadratin « – » dans
    # les plages de dates, etc. Les remplacer par ASCII dégraderait l'affichage.
    "RUF001", # ambiguous chars in strings
    "RUF002", # ambiguous chars in docstrings
    "RUF003", # ambiguous chars in comments
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S105", "S106", "ASYNC230"]
"scripts/**/*.py" = ["S105", "S106", "T201", "RUF100"]
"alembic/**/*.py" = ["E501"]
"app/core/security/tokens.py" = ["S105", "S106"]  # `token_type` n'est pas un secret
"app/schemas/auth.py" = ["S105", "S106"]  # `token_type: str = "bearer"` (RFC 6750)

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ----------------------------------------------------------------------
# Mypy — type checking strict
# ----------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "passlib.*",
    "asyncpg.*",
    # Adapters externes — deps optionnelles installées à la demande.
    "boto3.*",
    "aiosmtplib.*",
    "anthropic.*",
    "endesive.*",
    "SpiffWorkflow.*",
    "weasyprint.*",
    "pytesseract.*",
    "PIL.*",
    "pyotp.*",
    "cryptography.*",
    "sentry_sdk.*",
    "opentelemetry.*",
    "jinja2.*",
]
ignore_missing_imports = true

# ----------------------------------------------------------------------
# Pytest
# ----------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "integration: tests qui nécessitent une base PostgreSQL",
    "slow: tests lents",
]

[tool.coverage.run]
branch = true
source = ["app"]
omit = ["app/main.py", "tests/*", "alembic/*"]

[tool.coverage.report]
# TODO(2026-Q3): remonter à 75% via les vagues P0/P1 de tests métier (auth, personnel, recruitment, documents, leave). Voir issue #2.
fail_under = 50
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
