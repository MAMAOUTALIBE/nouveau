# =====================================================================
# Stack de développement local — backend + PostgreSQL + Redis + MinIO.
# =====================================================================
# Démarrer :   docker compose up -d
# Logs :       docker compose logs -f backend
# Migrations : docker compose exec backend alembic upgrade head
# Seed :       docker compose exec backend python -m scripts.seed_initial
# Arrêt :      docker compose down (volumes persistés via docker volume ls)
# =====================================================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: rh-postgres
    environment:
      POSTGRES_USER: rh_user
      POSTGRES_PASSWORD: rh_password
      POSTGRES_DB: rh_primature
    ports:
      - "5432:5432"
    volumes:
      - rh_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rh_user -d rh_primature"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: rh-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: rh-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: rh_minio_admin
      MINIO_ROOT_PASSWORD: rh_minio_password_change_me
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - rh_minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rh-backend
    environment:
      ENV: dev
      LOG_LEVEL: INFO
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-only-change-in-production-please-use-32-bytes-minimum}
      DATABASE_URL: postgresql+asyncpg://rh_user:rh_password@postgres:5432/rh_primature
      RUN_MIGRATIONS_ON_STARTUP: "true"
      ALLOWED_ORIGINS: "http://127.0.0.1:4200,http://localhost:4200"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  rh_postgres_data:
  rh_minio_data:
