# Pré-commit hooks GPA-GOUVE.
#
# Installation (une fois) :
#     pip install pre-commit  # ou : pipx install pre-commit
#     pre-commit install
#     pre-commit install --hook-type commit-msg
#
# Lancer manuellement sur tout le repo :
#     pre-commit run --all-files

repos:
  # ---------------------------------------------------------------------------
  # Hooks de base — fichiers, secrets, conflits.
  # ---------------------------------------------------------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^Final/(dist|node_modules|test-results)/
      - id: end-of-file-fixer
        exclude: ^Final/(dist|node_modules|test-results)/
      - id: check-yaml
        exclude: ^Final/backend/deploy/helm/templates/  # gabarits Helm Go
      - id: check-json
      - id: check-added-large-files
        args: ['--maxkb=1024']
      - id: check-merge-conflict
      - id: detect-private-key
      - id: mixed-line-ending
        args: ['--fix=lf']

  # ---------------------------------------------------------------------------
  # Détection de secrets — gitleaks.
  # ---------------------------------------------------------------------------
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  # ---------------------------------------------------------------------------
  # Backend Python — ruff (lint + format) + mypy.
  # ---------------------------------------------------------------------------
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.2
    hooks:
      - id: ruff
        files: ^Final/backend/
        args: ['--fix']
      - id: ruff-format
        files: ^Final/backend/

  - repo: local
    hooks:
      - id: mypy-backend
        name: mypy (backend)
        language: system
        files: ^Final/backend/app/.*\.py$
        pass_filenames: false
        entry: bash -c 'cd Final/backend && uv run mypy app'

  # ---------------------------------------------------------------------------
  # Frontend Angular — prettier.
  # ---------------------------------------------------------------------------
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        files: ^Final/(src|tests)/.*\.(ts|js|html|scss|css|json)$
        exclude: ^Final/(dist|node_modules|src/assets/scss/vendor)/

  # ---------------------------------------------------------------------------
  # Commit message — conventional commits.
  # ---------------------------------------------------------------------------
  - repo: https://github.com/commitizen-tools/commitizen
    rev: v3.31.0
    hooks:
      - id: commitizen
        stages: [commit-msg]
