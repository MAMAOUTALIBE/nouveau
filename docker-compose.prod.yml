# =====================================================================
# Stack de production — RH Primature
# PostgreSQL + Backend FastAPI + Frontend Angular (nginx)
#
# Déploiement :  docker compose -f docker-compose.prod.yml up -d --build
# Les valeurs sensibles proviennent du fichier .env (voir .env.prod.example).
# =====================================================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: rh-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rh_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD requis dans .env}
      POSTGRES_DB: ${POSTGRES_DB:-rh_primature}
    volumes:
      - rh_postgres_data:/var/lib/postgresql/data
      - ./deploy/postgres-init.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rh_user} -d ${POSTGRES_DB:-rh_primature}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Migrations Alembic — conteneur one-shot exécuté une fois, avant le backend.
  # (Évite de migrer dans chaque worker gunicorn et le conflit de boucle asyncio.)
  migrate:
    image: rhgn-backend:local
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rh-migrate
    command: ["alembic", "upgrade", "head"]
    environment:
      ENV: prod
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY requis dans .env (>=32 caracteres)}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-rh_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-rh_primature}
      # Clés PII (Sub-B) : Settings.model_post_init valide ces vars au boot,
      # même pour un job one-shot comme `alembic upgrade head`. Sans elles,
      # le job rh-migrate échoue et le backend n'est jamais (re)démarré.
      PII_ENCRYPTION_KEYS: ${PII_ENCRYPTION_KEYS:?PII_ENCRYPTION_KEYS requis dans .env (cf. .env.prod.example)}
      EMAIL_LOOKUP_HMAC_KEY: ${EMAIL_LOOKUP_HMAC_KEY:?EMAIL_LOOKUP_HMAC_KEY requis dans .env (cf. .env.prod.example)}
      # Cookies JWT : validators staging/prod exigent ces flags meme pour migrate.
      JWT_COOKIE_SECURE: ${JWT_COOKIE_SECURE:-true}
      JWT_RETURN_TOKEN_IN_BODY: ${JWT_RETURN_TOKEN_IN_BODY:-false}
    # La migration baseline 0001 rejoue les fichiers SQL de db/postgresql/,
    # qui ne sont pas dans l'image backend (hors contexte de build) : on les
    # monte là où la migration les cherche.
    volumes:
      - ./db/postgresql:/app/db/postgresql:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backend:
    image: rhgn-backend:local
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rh-backend
    restart: unless-stopped
    environment:
      ENV: prod
      LOG_LEVEL: INFO
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY requis dans .env (>=32 caracteres)}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-rh_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-rh_primature}
      # Migrations gérées par le service `migrate` — surtout pas au démarrage du backend.
      RUN_MIGRATIONS_ON_STARTUP: "false"
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      BCRYPT_ROUNDS: "12"
      # === Chiffrement PII au repos (Sub-B / loi 037/AN/2016) ===
      # Validators Pydantic refusent le boot prod sans ces vars.
      # Cf. docs/security/pii_migration_runbook.md
      PII_ENCRYPTION_KEYS: ${PII_ENCRYPTION_KEYS:?PII_ENCRYPTION_KEYS requis dans .env (cf. .env.prod.example)}
      EMAIL_LOOKUP_HMAC_KEY: ${EMAIL_LOOKUP_HMAC_KEY:?EMAIL_LOOKUP_HMAC_KEY requis dans .env (cf. .env.prod.example)}
      # === JWT cookies httpOnly (P0 #4) ===
      # Secure=true et tokens hors body OBLIGATOIRES en prod.
      # Cf. docs/security/auth_runbook.md
      JWT_COOKIE_SECURE: ${JWT_COOKIE_SECURE:-true}
      JWT_RETURN_TOKEN_IN_BODY: ${JWT_RETURN_TOKEN_IN_BODY:-false}
      JWT_COOKIE_NAME: ${JWT_COOKIE_NAME:-rh_access}
      JWT_REFRESH_COOKIE_NAME: ${JWT_REFRESH_COOKIE_NAME:-rh_refresh}
      JWT_COOKIE_SAMESITE: ${JWT_COOKIE_SAMESITE:-lax}
      JWT_COOKIE_DOMAIN: ${JWT_COOKIE_DOMAIN:-}
      # === Rate-limit /refresh dédié (plus serré que /login) ===
      RATE_LIMIT_REFRESH_MAX: ${RATE_LIMIT_REFRESH_MAX:-10}
      RATE_LIMIT_REFRESH_WINDOW_SECONDS: ${RATE_LIMIT_REFRESH_WINDOW_SECONDS:-60}
      RATE_LIMIT_REFRESH_LOCK_SECONDS: ${RATE_LIMIT_REFRESH_LOCK_SECONDS:-300}
      # === Upload guard (P0 #6) — défauts OK, opt-in ClamAV ===
      UPLOAD_MAX_SIZE_BYTES: ${UPLOAD_MAX_SIZE_BYTES:-52428800}
      CLAMAV_ENABLED: ${CLAMAV_ENABLED:-false}
      # IA / LLM — défaut "mock" si non renseigné dans .env (aucune casse).
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.3-70b-versatile}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # Le backend n'est PAS exposé directement : seul nginx (frontend) l'atteint.
    expose:
      - "8000"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rh-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${HTTP_PORT:-80}:80"
    # Routage du domaine via le Traefik de Hostinger (HTTPS auto Let's Encrypt).
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.rhgn.entrypoints=websecure"
      - "traefik.http.routers.rhgn.rule=Host(`rhgn.cloud`)"
      - "traefik.http.routers.rhgn.tls=true"
      - "traefik.http.routers.rhgn.tls.certresolver=letsencrypt"
      - "traefik.http.services.rhgn.loadbalancer.server.port=80"

volumes:
  rh_postgres_data:
