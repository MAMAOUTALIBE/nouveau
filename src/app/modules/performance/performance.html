<div class="row row-sm">
  <div class="col-xl-12">

    <!-- ============================ COCKPIT EVALUATION ============================ -->
    <div class="card custom-card mb-3">
      <div class="card-header">
        <div class="card-title">Evaluation</div>
      </div>
      <div class="card-body">
        <ul class="nav nav-tabs mb-4" role="tablist">
          <li class="nav-item">
            <a
              class="nav-link"
              role="button"
              style="cursor: pointer"
              [class.active]="activeTab === 'campaigns'"
              (click)="setTab('campaigns')">
              <i class="ri-survey-line me-1"></i>Campagnes
              <span class="badge bg-primary-transparent ms-1">{{ campaignsCount }}</span>
            </a>
          </li>
          <li class="nav-item">
            <a
              class="nav-link"
              role="button"
              style="cursor: pointer"
              [class.active]="activeTab === 'results'"
              (click)="setTab('results')">
              <i class="ri-bar-chart-box-line me-1"></i>Resultats
              <span class="badge bg-primary-transparent ms-1">{{ resultsCount }}</span>
            </a>
          </li>
        </ul>

        <div class="row g-3">
          <div class="col-6 col-xl-3">
            <div class="card shadow-none border mb-0 h-100">
              <div class="card-body d-flex align-items-center gap-3 p-3">
                <div
                  class="d-inline-flex align-items-center justify-content-center rounded-circle bg-primary-transparent flex-shrink-0"
                  style="width: 46px; height: 46px">
                  <i class="ri-survey-line fs-5 text-primary"></i>
                </div>
                <div>
                  <div class="fs-4 fw-semibold lh-1">{{ campaignsCount }}</div>
                  <div class="text-muted fs-11 mt-1">Campagnes</div>
                </div>
              </div>
            </div>
          </div>
          <div class="col-6 col-xl-3">
            <div class="card shadow-none border mb-0 h-100">
              <div class="card-body d-flex align-items-center gap-3 p-3">
                <div
                  class="d-inline-flex align-items-center justify-content-center rounded-circle bg-success-transparent flex-shrink-0"
                  style="width: 46px; height: 46px">
                  <i class="ri-play-circle-line fs-5 text-success"></i>
                </div>
                <div>
                  <div class="fs-4 fw-semibold lh-1">{{ activeCampaignsCount }}</div>
                  <div class="text-muted fs-11 mt-1">Campagnes actives</div>
                </div>
              </div>
            </div>
          </div>
          <div class="col-6 col-xl-3">
            <div class="card shadow-none border mb-0 h-100">
              <div class="card-body d-flex align-items-center gap-3 p-3">
                <div
                  class="d-inline-flex align-items-center justify-content-center rounded-circle bg-info-transparent flex-shrink-0"
                  style="width: 46px; height: 46px">
                  <i class="ri-bar-chart-box-line fs-5 text-info"></i>
                </div>
                <div>
                  <div class="fs-4 fw-semibold lh-1">{{ resultsCount }}</div>
                  <div class="text-muted fs-11 mt-1">Resultats</div>
                </div>
              </div>
            </div>
          </div>
          <div class="col-6 col-xl-3">
            <div class="card shadow-none border mb-0 h-100">
              <div class="card-body d-flex align-items-center gap-3 p-3">
                <div
                  class="d-inline-flex align-items-center justify-content-center rounded-circle bg-warning-transparent flex-shrink-0"
                  style="width: 46px; height: 46px">
                  <i class="ri-medal-line fs-5 text-warning"></i>
                </div>
                <div>
                  <div class="fs-4 fw-semibold lh-1">{{ averageScore }}</div>
                  <div class="text-muted fs-11 mt-1">Score moyen</div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- ============================ CONTENU DE L'ONGLET ACTIF ============================ -->
<app-perf-campaigns *ngIf="activeTab === 'campaigns'"></app-perf-campaigns>
<app-perf-results *ngIf="activeTab === 'results'"></app-perf-results>
