<div class="row row-sm">
  <div class="col-xl-12">

    <!-- ============================ COCKPIT ABSENCES ============================ -->
    <div class="card custom-card mb-3">
      <div class="card-header">
        <div class="card-title">Absences</div>
      </div>
      <div class="card-body">
        <ul class="nav nav-tabs mb-4" role="tablist">
          <li class="nav-item">
            <a
              class="nav-link"
              role="button"
              style="cursor: pointer"
              [class.active]="activeTab === 'requests'"
              (click)="setTab('requests')">
              <i class="ri-file-list-3-line me-1"></i>Demandes
              <span class="badge bg-primary-transparent ms-1">{{ requestsCount }}</span>
            </a>
          </li>
          <li class="nav-item">
            <a
              class="nav-link"
              role="button"
              style="cursor: pointer"
              [class.active]="activeTab === 'calendar'"
              (click)="setTab('calendar')">
              <i class="ri-calendar-2-line me-1"></i>Calendrier
            </a>
          </li>
          <li class="nav-item">
            <a
              class="nav-link"
              role="button"
              style="cursor: pointer"
              [class.active]="activeTab === 'balances'"
              (click)="setTab('balances')">
              <i class="ri-wallet-3-line me-1"></i>Soldes
              <span class="badge bg-primary-transparent ms-1">{{ balancesCount }}</span>
            </a>
          </li>
        </ul>

        <div class="row g-3">
          <div class="col-6 col-xl-3">
            <div class="card shadow-none border mb-0 h-100">
              <div class="card-body d-flex align-items-center gap-3 p-3">
                <div
                  class="d-inline-flex align-items-center justify-content-center rounded-circle bg-primary-transparent flex-shrink-0"
                  style="width: 46px; height: 46px">
                  <i class="ri-file-list-3-line fs-5 text-primary"></i>
                </div>
                <div>
                  <div class="fs-4 fw-semibold lh-1">{{ requestsCount }}</div>
                  <div class="text-muted fs-11 mt-1">Demandes</div>
                </div>
              </div>
            </div>
          </div>
          <div class="col-6 col-xl-3">
            <div class="card shadow-none border mb-0 h-100">
              <div class="card-body d-flex align-items-center gap-3 p-3">
                <div
                  class="d-inline-flex align-items-center justify-content-center rounded-circle bg-warning-transparent flex-shrink-0"
                  style="width: 46px; height: 46px">
                  <i class="ri-time-line fs-5 text-warning"></i>
                </div>
                <div>
                  <div class="fs-4 fw-semibold lh-1">{{ pendingCount }}</div>
                  <div class="text-muted fs-11 mt-1">En attente</div>
                </div>
              </div>
            </div>
          </div>
          <div class="col-6 col-xl-3">
            <div class="card shadow-none border mb-0 h-100">
              <div class="card-body d-flex align-items-center gap-3 p-3">
                <div
                  class="d-inline-flex align-items-center justify-content-center rounded-circle bg-success-transparent flex-shrink-0"
                  style="width: 46px; height: 46px">
                  <i class="ri-checkbox-circle-line fs-5 text-success"></i>
                </div>
                <div>
                  <div class="fs-4 fw-semibold lh-1">{{ approvedCount }}</div>
                  <div class="text-muted fs-11 mt-1">Validees</div>
                </div>
              </div>
            </div>
          </div>
          <div class="col-6 col-xl-3">
            <div class="card shadow-none border mb-0 h-100">
              <div class="card-body d-flex align-items-center gap-3 p-3">
                <div
                  class="d-inline-flex align-items-center justify-content-center rounded-circle bg-info-transparent flex-shrink-0"
                  style="width: 46px; height: 46px">
                  <i class="ri-wallet-3-line fs-5 text-info"></i>
                </div>
                <div>
                  <div class="fs-4 fw-semibold lh-1">{{ balancesCount }}</div>
                  <div class="text-muted fs-11 mt-1">Soldes suivis</div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- ============================ CONTENU DE L'ONGLET ACTIF ============================ -->
<app-leave-requests *ngIf="activeTab === 'requests'"></app-leave-requests>
<app-leave-calendar *ngIf="activeTab === 'calendar'"></app-leave-calendar>
<app-leave-balances *ngIf="activeTab === 'balances'"></app-leave-balances>
