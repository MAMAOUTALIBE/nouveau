<div class="row row-sm">
  <div class="col-xl-12">
    <div class="card custom-card">
      <div class="card-header justify-content-between">
        <div class="card-title">Postes vacants</div>
        <div class="btn-list">
          <button type="button" class="btn btn-primary" (click)="toggleCreateForm()">
            <i class="ri-add-line me-1"></i>Publier une offre
          </button>
          <button type="button" class="btn btn-outline-primary">
            <i class="ri-download-2-line me-1"></i>Exporter
          </button>
        </div>
      </div>
      <div class="card-body">
        <gridjs-angular [config]="gridConfig"></gridjs-angular>
      </div>
    </div>
  </div>
</div>

<!-- Modale : nouveau poste vacant -->
<div
  class="modal d-block"
  tabindex="-1"
  *ngIf="showCreateForm"
  style="background-color: rgba(0, 0, 0, 0.55)">
  <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
    <div class="modal-content">
      <form [formGroup]="form" (ngSubmit)="savePosition()">
        <div class="modal-header">
          <h6 class="modal-title"><i class="ri-user-unfollow-line me-2 text-primary"></i>Publier un poste vacant</h6>
          <button type="button" class="btn btn-sm btn-light" (click)="cancelCreate()">
            <i class="ri-close-line"></i>
          </button>
        </div>
        <div class="modal-body">
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label">Code (optionnel)</label>
              <input type="text" class="form-control" formControlName="code" />
              <div class="text-danger fs-11 mt-1" *ngIf="fieldError('code') as error">{{ error }}</div>
            </div>
            <div class="col-md-6">
              <label class="form-label">Structure</label>
              <input type="text" class="form-control" formControlName="structure" />
              <div class="text-danger fs-11 mt-1" *ngIf="fieldError('structure') as error">{{ error }}</div>
            </div>
            <div class="col-md-6">
              <label class="form-label">Intitule</label>
              <input type="text" class="form-control" formControlName="title" />
              <div class="text-danger fs-11 mt-1" *ngIf="fieldError('title') as error">{{ error }}</div>
            </div>
            <div class="col-md-6">
              <label class="form-label">Grade</label>
              <input type="text" class="form-control" formControlName="grade" />
              <div class="text-danger fs-11 mt-1" *ngIf="fieldError('grade') as error">{{ error }}</div>
            </div>
            <div class="col-md-6">
              <label class="form-label">Date d ouverture</label>
              <input type="date" class="form-control" formControlName="openedOn" />
              <div class="text-danger fs-11 mt-1" *ngIf="fieldError('openedOn') as error">{{ error }}</div>
            </div>
            <div class="col-md-6">
              <label class="form-label">Priorite</label>
              <select class="form-select" formControlName="priority">
                <option value="Haute">Haute</option>
                <option value="Normale">Normale</option>
                <option value="Basse">Basse</option>
              </select>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-light" (click)="cancelCreate()" [disabled]="submitting">
            Annuler
          </button>
          <button type="submit" class="btn btn-primary" [disabled]="submitting">
            {{ submitting ? 'Enregistrement...' : 'Publier le poste' }}
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
